n:['Игровое новогоднее поздравление','New Year games greeting','საახალწლო სათამაშო მილოცვა'],min:['20–30 мин (±5 мин)','20–30 min (±5 min)','20–30 წთ (±5 წთ)'],bt:['за 1–4 детей','for 1–4 children','1–4 ბავშვზე'],
s:['Весёлое короткое поздравление с играми от Деда Мороза и Снегурочки','A fun, short greeting with games from Father Frost and the Snow Maiden','მხიარული, მოკლე მილოცვა თამაშებით ბაბუა ყინვასა და თოვლის გოგონასგან'],
d:['Самый популярный домашний формат для детей от 3 до 8 лет. Дед Мороз и Снегурочка приносят с собой не только новогоднее настроение, но и весёлые игры. В программе: загадки от Снегурочки, лёгкие подвижные игры (мягкие снежки, «заморожу», преодоление сугробов), традиционный хоровод, стихи, фотографии и вручение подарков.','The most popular home format for children aged 3 to 8. Father Frost and the Snow Maiden bring not only the New Year mood but also fun games. The programme includes riddles from the Snow Maiden, light active games (soft snowballs, “I will freeze you”, crossing the snowdrifts), the traditional round dance, poems, photos and the handing out of gifts.','ყველაზე პოპულარული საშინაო ფორმატი 3-დან 8 წლამდე ბავშვებისთვის. ბაბუა ყინვა და თოვლის გოგონა თან მოაქვთ არა მხოლოდ საახალწლო განწყობა, არამედ მხიარული თამაშებიც. პროგრამაში: თოვლის გოგონას გამოცანები, მსუბუქი მოძრავი თამაშები (რბილი თოვლის ბურთები, „გაგაყინავ“, ზვინების გადალახვა), ტრადიციული მრგვალი ცეკვა, ლექსები, ფოტოები და საჩუქრების გადაცემა.'],
i:['Длительность 20–30 минут (±5). Подарок предоставляет заказчик. Нужно свободное место примерно 2×2 м.','Duration 20–30 minutes (±5). The client provides the gift. About 2×2 m of free space is needed.','ხანგრძლივობა 20–30 წუთი (±5). საჩუქარს უზრუნველყოფს დამკვეთი. საჭიროა დაახლოებით 2×2 მ თავისუფალი სივრცე.']},
{id:'p3',ic:'celebration',tags:'group inst home',p2:300,c:{ch:80,org:20,cos:40,pr:15},base:10,
n:['Игровая новогодняя программа','New Year games programme','საახალწლო სათამაშო პროგრამა'],min:['60 мин (±5 мин)','60 min (±5 min)','60 წთ (±5 წთ)'],bt:['за группу до 10 детей','for a group of up to 10 children','10 ბავშვამდე ჯგუფზე'],
s:['Час музыки, эстафет и танцев для компании детей','An hour of music, relays and dancing for a group of children','საათი მუსიკის, ესტაფეტებისა და ცეკვების ბავშვთა კომპანიისთვის'],
d:['Масштабный, динамичный праздник для компании детей, домашней вечеринки, детского сада или школьного класса. Целый час непрерывного веселья: сюжетная завязка, музыкальные баттлы, командные эстафеты с ярким реквизитом, танцевальный флешмоб с Дедом Морозом и Снегурочкой, хоровод, чтение стихов, торжественная церемония награждения каждого ребёнка и фотосессия.','A large-scale, dynamic party for a group of children, a home party, a kindergarten or a school class. A whole hour of non-stop fun: a story opening, musical battles, team relays with bright props, a dance flash mob with Father Frost and the Snow Maiden, a round dance, poems, a festive award ceremony for every child and a photo session.','მასშტაბური, დინამიური დღესასწაული ბავშვთა კომპანიისთვის, საშინაო წვეულებისთვის, საბავშვო ბაღისთვის ან სკოლის კლასისთვის. მთელი საათი შეუჩერებელი გართობისა: სიუჟეტური დასაწყისი, მუსიკალური ბატლები, გუნდური ესტაფეტები ნათელი რეკვიზიტით, საცეკვაო ფლეშმობი ბაბუა ყინვასა და თოვლის გოგონასთან ერთად, მრგვალი ცეკვა, ლექსები, თითოეული ბავშვის საზეიმო დაჯილდოება და ფოტოსესია.'],
i:['Длительность 60 минут (±5). Подходит для компаний от 3 до 15+ детей, утренников и корпоративных ёлок. Если детей больше 12, помощь взрослых в эстафетах очень пригодится.','Duration 60 minutes (±5). Suits groups of 3 to 15+ children, matinees and corporate New Year parties. With more than 12 children, help from adults during the relays is very useful.','ხანგრძლივობა 60 წუთი (±5). ვარგისია 3-დან 15+ ბავშვის ჯგუფებისთვის, საბავშვო დილებისა და კორპორატიული ნაძვის ხეებისთვის. თუ ბავშვი 12-ზე მეტია, ესტაფეტებში უფროსების დახმარება ძალიან გამოგადგებათ.']},
{id:'p4',ic:'search',tags:'group inst home',p2:300,c:{ch:80,org:20,cos:40,pr:15},base:10,
n:['Новогодний квест','New Year quest','საახალწლო ქვესტი'],min:['60 мин (±5 мин)','60 min (±5 min)','60 წთ (±5 წთ)'],bt:['за группу до 10 детей','for a group of up to 10 children','10 ბავშვამდე ჯგუფზე'],
s:['Сюжетное приключение с загадками для детей от 5–6 лет','A story adventure with riddles for ages 5–6 and up','სიუჟეტური თავგადასავალი გამოცანებით 5–6 წლიდან'],
d:['Увлекательное детективное приключение для детей от 5–6 лет, которым уже неинтересны просто хороводы. Зимняя вьюга перепутала маршруты саней, и подарки, праздник или сам Дедушка оказались заперты на волшебный замок! Вместе со Снегурочкой и Дедом Морозом ребята разгадают серию загадок, найдут спрятанные в локации подсказки и пройдут испытания на ловкость и смекалку, чтобы открыть заветный сундук.','An exciting detective adventure for children aged 5–6 and up who are no longer interested in plain round dances. A winter blizzard has mixed up the sleigh routes, and the gifts, the holiday or Grandfather Frost himself have been locked behind a magic lock! Together with the Snow Maiden and Father Frost, the kids solve a series of riddles, find clues hidden around the location and pass tests of agility and wit to open the treasured chest.','საინტერესო დეტექტიური თავგადასავალი 5–6 წლიდან ბავშვებისთვის, რომლებსაც უკვე აღარ აინტერესებთ უბრალო მრგვალი ცეკვები. ზამთრის ქარბუქმა ციგების მარშრუტები აურია და საჩუქრები, დღესასწაული ან თვით ბაბუა ყინვა ჯადოსნური საკეტით აღმოჩნდნენ ჩაკეტილი! თოვლის გოგონასა და ბაბუა ყინვასთან ერთად ბავშვები ამოხსნიან გამოცანების სერიას, იპოვიან ლოკაციაზე დამალულ მინიშნებებს და გაივლიან მოხერხებულობისა და ჭკუის გამოცდებს, რომ გახსნან საოცნებო სკივრი.'],
i:['Длительность 60 минут (±5). Артистам нужно прийти за 15 минут до начала, чтобы осмотреть место и спрятать подсказки в безопасных местах.','Duration 60 minutes (±5). The performers need to arrive 15 minutes early to look over the place and hide the clues in safe spots.','ხანგრძლივობა 60 წუთი (±5). შემსრულებლები 15 წუთით ადრე უნდა მოვიდნენ, რომ ადგილი დაათვალიერონ და მინიშნებები უსაფრთხო ადგილებში დამალონ.']},
{id:'p5',ic:'explore',tags:'group inst home',p2:350,c:{ch:100,org:20,cos:40,pr:15},base:10,
n:['Большой новогодний квест','Grand New Year quest','დიდი საახალწლო ქვესტი'],min:['80 мин (±5 мин)','80 min (±5 min)','80 წთ (±5 წთ)'],bt:['за группу детей','for a group of children','ბავშვთა ჯგუფზე'],
s:['Большой квест с множеством загадок для детей 6–12 лет','A grand quest with plenty of puzzles for ages 6–12','დიდი ქვესტი მრავალი გამოცანით 6–12 წლის ბავშვებისთვის'],
d:['Максимальное приключение для активных и любознательных компаний (от 6 до 12 лет). Усложнённый сюжет с несколькими уровнями загадок, командными миссиями и торжественным финалом с Дедом Морозом. Идеально для загородных домов, больших квартир, лофтов и школьных или садиковых мероприятий.','The ultimate adventure for active and curious groups (ages 6 to 12). A more complex story with several levels of riddles, team missions and a festive finale with Father Frost. Ideal for country houses, large apartments, lofts and school or kindergarten events.','მაქსიმალური თავგადასავალი აქტიური და ცნობისმოყვარე კომპანიებისთვის (6-დან 12 წლამდე). გართულებული სიუჟეტი გამოცანების რამდენიმე დონით, გუნდური მისიებით და საზეიმო ფინალით ბაბუა ყინვასთან ერთად. იდეალურია სასოფლო სახლებისთვის, დიდი ბინებისთვის, ლოფტებისთვის და სკოლის ან საბავშვო ბაღის ღონისძიებებისთვის.'],
i:['Длительность 80 минут (±5). Артисты приходят за 20 минут до начала. Элементы научного или творческого интерактива внутри сюжета оплачиваются отдельно (примерно +80 ₾).','Duration 80 minutes (±5). The performers arrive 20 minutes early. Science or creative interactive elements inside the story are paid separately (about +₾80).','ხანგრძლივობა 80 წუთი (±5). შემსრულებლები 20 წუთით ადრე მოდიან. სიუჟეტში ჩართული სამეცნიერო ან შემოქმედებითი ინტერაქტიული ელემენტები ცალკე ფასდება (დაახლოებით +80 ₾).']}];

{id:'cryo',ic:'science',t:'cryo',max:30,n:['Крио-шоу с сухим льдом','Dry ice cryo show','კრიო-შოუ მშრალი ყინულით'],min:['~30 мин','~30 min','~30 წთ'],
s:['Морозный туман и безопасные ледяные эксперименты','Frosty fog and safe ice experiments','ყინვის ნისლი და უსაფრთხო ყინულის ექსპერიმენტები'],
d:['Настоящая магия Севера прямо у вас дома! Дед Мороз покажет, из чего состоит зимняя вьюга: дети увидят густой белый туман, стелющийся по полу, потрогают морозные облака, увидят ледяное кипение, послушают пение льда и поучаствуют в безопасных зрелищных экспериментах с сухим льдом.','Real northern magic right at your home! Father Frost shows what a winter blizzard is made of: the children see thick white fog creeping along the floor, touch frosty clouds, watch the ice “boil”, listen to the ice “sing” and take part in safe, spectacular experiments with dry ice.','ჩრდილოეთის ნამდვილი ჯადოქრობა თქვენს სახლში! ბაბუა ყინვა აჩვენებს, საიდან შედგება ზამთრის ქარბუქი: ბავშვები იხილავენ იატაკზე გადაწოლილ სქელ თეთრ ნისლს, შეეხებიან ყინვის ღრუბლებს, იხილავენ ყინულის „დუღილს“, მოუსმენენ ყინულის სიმღერას და მონაწილეობას მიიღებენ უსაფრთხო, სანახაობრივ ექსპერიმენტებში მშრალი ყინულით.'],
i:['~30 минут. 150 ₾ за шоу до 10 детей, каждый следующий ребёнок +15 ₾. Нужны устойчивый стол и тёплая вода. Ведущий следит, чтобы дети не брали сухой лёд голыми руками.','~30 minutes. ₾150 per show for up to 10 children, each additional child +₾15. A stable table and warm water are needed. The host makes sure children never touch dry ice with bare hands.','~30 წუთი. 150 ₾ შოუზე 10 ბავშვამდე, ყოველი შემდეგი ბავშვი +15 ₾. საჭიროა მყარი მაგიდა და თბილი წყალი. წამყვანი აკონტროლებს, რომ ბავშვებმა მშრალ ყინულს შიშველი ხელი არ მოკიდონ.']},
{id:'pen',ic:'draw',u:35,max:10,pre:.5,lead:1,ext:1.75,n:['Мастер-класс «3D-ручка»','Workshop: 3D pen','სახელოსნო „3D კალამი“'],min:['30 мин','30 min','30 წთ'],
s:['Рисуем объёмные новогодние игрушки 3D-ручкой','We draw 3D New Year ornaments with a 3D pen','3D კალმით ვხატავთ მოცულობით საახალწლო სათამაშოებს'],
d:['Современный технологичный мастер-класс для юных изобретателей (от 6 лет). Под руководством ведущего дети осваивают работу с 3D-ручкой и безопасным биоразлагаемым пластиком и создают собственный новогодний сувенир — ёлочную игрушку, значок, брелок или магнитик — по трафаретам или по своему эскизу.','A modern, high-tech workshop for young inventors (ages 6 and up). Guided by the host, the children learn to use a 3D pen with safe biodegradable plastic and make their own New Year souvenir — a tree ornament, badge, keychain or magnet — from stencils or their own sketch.','თანამედროვე ტექნოლოგიური სახელოსნო ახალგაზრდა გამომგონებლებისთვის (6 წლიდან). წამყვანის ხელმძღვანელობით ბავშვები ეუფლებიან 3D კალმით მუშაობას უსაფრთხო ბიოდეგრადირებადი პლასტიკით და ქმნიან საკუთარ საახალწლო სუვენირს — ნაძვის სათამაშოს, ბეჯს, ბრელოკს ან მაგნიტს — ტრაფარეტით ან საკუთარი ესკიზით.'],
i:['30 минут; продление — 1,75 ₾ за минуту с участника (+15 мин = 26,25 ₾ с участника). Бронь за 2–3 недели, предоплата 50%. До 10 участников. Нужны стол, стулья по числу детей и розетка 220 В.','30 minutes; extension is ₾1.75 per minute per participant (+15 min = ₾26.25 per participant). Book 2–3 weeks ahead, 50% prepayment. Up to 10 participants. A table, chairs for every child and a 220 V socket are needed.','30 წუთი; გაგრძელება — 1,75 ₾ წუთში თითო მონაწილეზე (+15 წთ = 26,25 ₾ თითო მონაწილეზე). ჯავშანი 2–3 კვირით ადრე, 50% წინასწარი გადახდა. მაქს. 10 მონაწილე. საჭიროა მაგიდა, სკამები ბავშვების რაოდენობით და 220 ვ ელექტროსოკეტი.']},
{id:'globe',ic:'public',u:35,max:10,pre:.3,lead:1,n:['Мастер-класс «Снежный шар»','Workshop: snow globe','სახელოსნო „თოვლის გლობუსი“'],min:['25–30 мин','25–30 min','25–30 წთ'],
s:['Создаём волшебный шар с зимней фигуркой и кружащимся снегом','We make a magic globe with a winter figurine and swirling snow','ვქმნით ჯადოსნურ გლობუსს ზამთრის ფიგურითა და მოტივტივე თოვლით'],
d:['Самый атмосферный новогодний сувенир, который остаётся на долгую память. Каждый ребёнок выберет зимнюю фигурку (ёлочку, снеговика, домик или оленя), закрепит её внутри прозрачной баночки, добавит серебристые блёстки, искусственный снег и наполнит шар жидкостью, в которой снежинки плавно парят при встряхивании.','The most atmospheric New Year keepsake, one that stays for years. Each child chooses a winter figurine (a fir tree, a snowman, a little house or a deer), fixes it inside a clear jar, adds silver glitter and artificial snow and fills the globe with a magic liquid in which snowflakes float gently when shaken.','ყველაზე ატმოსფერული საახალწლო სუვენირი, რომელიც დიდხანს შემორჩება. თითოეული ბავშვი აირჩევს ზამთრის ფიგურას (ნაძვი, თოვლის კაცი, სახლი ან ირემი), დაამაგრებს მას გამჭვირვალე ქილაში, დაამატებს ვერცხლისფერ ბრჭყვიალას, ხელოვნურ თოვლს და გლობუსს ავსებს ჯადოსნური სითხით, რომელშიც ფიფქები ნელა ცურავენ შენჯღრევისას.'],
i:['25–30 минут. Бронь минимум за 2 недели, предоплата 30%. До 10 участников. С клеевым пистолетом работает только взрослый.','25–30 minutes. Book at least 2 weeks ahead, 30% prepayment. Up to 10 participants. Only an adult uses the glue gun.','25–30 წუთი. ჯავშანი მინიმუმ 2 კვირით ადრე, 30% წინასწარი გადახდა. მაქს. 10 მონაწილე. წებოს პისტოლეტით მხოლოდ მოზრდილი მუშაობს.']},
{id:'choc',ic:'cookie',u:23,max:10,n:['Мастер-класс «Бельгийский шоколад»','Workshop: Belgian chocolate','სახელოსნო „ბელგიური შოკოლადი“'],min:['20 мин + 5 мин заморозка','20 min + 5 min freezing','20 წთ + 5 წთ გაყინვა'],
s:['Украшаем бельгийский шоколад и замораживаем на сухом льду','We decorate Belgian chocolate and freeze it on dry ice','ბელგიურ შოკოლადს ვაფორმებთ და მშრალ ყინულზე ვყინავთ'],
d:['Гастрономический восторг для сладкоежек! Ребята украсят порцию настоящего бельгийского шоколада воздушным маршмеллоу, орешками, сублимированными ягодами и кондитерскими посыпками. А затем произойдёт настоящее чудо: за 5 минут мы мгновенно заморозим сладости в специальном контейнере с сухим льдом, чтобы их можно было сразу съесть или красиво упаковать.','A feast for sweet tooths! The kids decorate a portion of real Belgian chocolate with fluffy marshmallows, nuts, freeze-dried berries and sprinkles. Then comes a little miracle: in 5 minutes we flash-freeze the sweets in a special dry ice container so they can be eaten at once or packed beautifully.','გასტრონომიული აღფრთოვანება ტკბილეულის მოყვარულებისთვის! ბავშვები ნამდვილი ბელგიური შოკოლადის ულუფას მოაწყობენ ჰაეროვანი მარშმელოუთი, თხილეულით, გამხმარი კენკრითა და საკონდიტრო მოსაპნევით. შემდეგ კი ნამდვილი სასწაული ხდება: 5 წუთში ტკბილეულს სპეციალურ მშრალი ყინულის კონტეინერში მყისიერად ვყინავთ, რომ მაშინვე შეჭამონ ან ლამაზად შეფუთონ.'],
i:['20 минут + 5 минут заморозка. До 10 участников. Укажите при заказе, если у детей есть пищевая аллергия.','20 minutes + 5 minutes of freezing. Up to 10 participants. Tell us at booking if any children have food allergies.','20 წუთი + 5 წუთი გაყინვა. მაქს. 10 მონაწილე. შეკვეთისას მიუთითეთ, თუ ბავშვებს კვებითი ალერგია აქვთ.']},
{id:'cook',ic:'bakery_dining',u:20,max:10,n:['Мастер-класс «Имбирное печенье»','Workshop: gingerbread cookies','სახელოსნო „ჯანჯაფილის ნამცხვარი“'],min:['15 мин','15 min','15 წთ'],
s:['Расписываем три имбирных пряника цветной глазурью','We decorate three gingerbread cookies with colourful icing','სამ ჯანჯაფილის ნამცხვარს ვღებავთ ფერადი მინანქრით'],
d:['Уютный, быстрый и ароматный мастер-класс, который идеально дополняет короткое поздравление. Каждый ребёнок получит набор из 3 фигурных имбирных пряников, кондитерские мешочки с разноцветной глазурью и яркие посыпки. Готовые шедевры упаковываются в нарядный пакетик.','A cosy, quick and fragrant workshop that perfectly complements a short greeting. Each child gets a set of 3 shaped gingerbread cookies, piping bags with colourful icing and bright sprinkles. The finished masterpieces are packed in a festive bag.','მყუდრო, სწრაფი და არომატული სახელოსნო, რომელიც იდეალურად ავსებს მოკლე მილოცვას. თითოეული ბავშვი მიიღებს 3 ფიგურულ ჯანჯაფილის ნამცხვარს, ფერადი მინანქრის საკონდიტრო ტომარებს და ნათელ მოსაპნევს. მზა შედევრები დაიტვირთება სადღესასწაულო პარკში.'],
i:['15 минут. До 10 участников. Укажите при заказе, если у детей есть пищевая аллергия.','15 minutes. Up to 10 participants. Tell us at booking if any children have food allergies.','15 წუთი. მაქს. 10 მონაწილე. შეკვეთისას მიუთითეთ, თუ ბავშვებს კვებითი ალერგია აქვთ.']},
{id:'bead',ic:'diamond',u:18,max:10,n:['Мастер-класс «Браслеты, бусы, брелоки»','Workshop: bracelets, beads, keychains','სახელოსნო „სამაჯურები, მძივები, ბრელოკები“'],min:['20–30 мин','20–30 min','20–30 წთ'],
s:['Собираем браслеты, бусы и брелоки из бусин','We make bracelets, necklaces and keychains from beads','ვაწყობთ სამაჯურებს, მძივებსა და ბრელოკებს მძივებისგან'],
d:['Спокойный творческий мастер-класс, который подходит детям от 4 лет и ребятам, которым нравятся аккуратные занятия руками. Собираем уникальные новогодние украшения или брелоки со снежинками, звёздочками и перламутровыми бусинами.','A calm creative workshop for children aged 4 and up and for kids who enjoy neat handiwork. We assemble unique New Year jewellery or keychains with snowflakes, little stars and pearly beads.','მშვიდი შემოქმედებითი სახელოსნო 4 წლიდან ბავშვებისთვის და მათთვის, ვისაც სუფთა ხელსაქმე უყვარს. ვაწყობთ უნიკალურ საახალწლო სამკაულებს ან ბრელოკებს ფიფქებით, ვარსკვლავებითა და სადაფისფერი მძივებით.'],

function drum(cid,did,val){const c=g(cid),cur=g(did),v=String(val).padStart(2,'0');if(!c||cur.textContent===v)return;
 const nx=document.createElement('span');nx.className='drum-digit digit-enter-down'+(cid==='drum-seconds'?' text-white':'');nx.id=did;nx.textContent=v;
 cur.removeAttribute('id');cur.className='drum-digit digit-exit-down';c.appendChild(nx);setTimeout(()=>cur.remove(),380)}
function tick(){const n=new Date(),tb=new Date(n.getTime()+n.getTimezoneOffset()*6e4+4*36e5);
 g('clock').textContent=tb.toTimeString().split(' ')[0]+' UTC+4';
 const z=Math.max(0,new Date(CFG.ny)-n);
 drum('drum-days','digit-days',Math.floor(z/864e5));drum('drum-hours','digit-hours',Math.floor(z/36e5)%24);drum('drum-minutes','digit-minutes',Math.floor(z/6e4)%60);drum('drum-seconds','digit-seconds',Math.floor(z/1e3)%60)}
setInterval(tick,1000);tick();statics();render();
